<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Retro pixel icon: air ambulance helicopter -->
  <!-- Main rotor and mast -->
  <rect x="3" y="5" width="27" height="1" fill="#000000"/>
  <rect x="15" y="6" width="2" height="3" fill="#000000"/>
  <!-- Tail boom, fin and tail rotor -->
  <rect x="2" y="12" width="8" height="3" fill="#000000"/>
  <rect x="3" y="13" width="7" height="1" fill="#c00000"/>
  <rect x="1" y="8" width="3" height="7" fill="#000000"/>
  <rect x="2" y="9" width="1" height="4" fill="#c00000"/>
  <rect x="0" y="9" width="1" height="5" fill="#808080"/>
  <!-- Cabin -->
  <rect x="9" y="9" width="13" height="11" fill="#000000"/>
  <rect x="8" y="10" width="16" height="9" fill="#000000"/>
  <rect x="24" y="12" width="1" height="6" fill="#000000"/>
  <rect x="9" y="10" width="13" height="9" fill="#c00000"/>
  <rect x="22" y="11" width="2" height="8" fill="#c00000"/>
  <rect x="9" y="10" width="9" height="1" fill="#ff6060"/>
  <rect x="9" y="18" width="15" height="1" fill="#800000"/>
  <!-- Windscreen -->
  <rect x="18" y="11" width="6" height="5" fill="#000000"/>
  <rect x="19" y="12" width="4" height="3" fill="#80c0ff"/>
  <rect x="19" y="12" width="2" height="1" fill="#ffffff"/>
  <!-- Medical cross -->
  <rect x="11" y="13" width="5" height="1" fill="#ffffff"/>
  <rect x="13" y="11" width="1" height="5" fill="#ffffff"/>
  <!-- Skids -->
  <rect x="11" y="20" width="1" height="3" fill="#000000"/>
  <rect x="19" y="20" width="1" height="3" fill="#000000"/>
  <rect x="8" y="23" width="16" height="1" fill="#000000"/>
  <rect x="24" y="22" width="1" height="1" fill="#000000"/>
</svg>
