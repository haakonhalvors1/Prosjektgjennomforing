  <rect x="11" y="10" width="10" height="1" fill="#c00000"/>
  <rect x="9" y="11" width="14" height="3" fill="#c00000"/>
  <rect x="10" y="11" width="5" height="3" fill="#80c0ff"/>
  <rect x="16" y="11" width="5" height="3" fill="#80c0ff"/>
