  <rect x="7" y="21" width="2" height="2" fill="#c0c0c0"/>
  <rect x="21" y="20" width="6" height="4" fill="#000000"/>
  <rect x="22" y="19" width="4" height="6" fill="#000000"/>
  <rect x="23" y="21" width="2" height="2" fill="#c0c0c0"/>
</svg>
