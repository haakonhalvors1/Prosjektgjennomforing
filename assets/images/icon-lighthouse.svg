  <rect x="3" y="4" width="5" height="1" fill="#ffd050"/>
  <rect x="21" y="6" width="6" height="1" fill="#ffd050"/>
  <rect x="24" y="4" width="5" height="1" fill="#ffd050"/>
  <!-- Roof -->
  <rect x="15" y="1" width="2" height="1" fill="#000000"/>
  <rect x="13" y="2" width="6" height="1" fill="#000000"/>
  <rect x="12" y="3" width="8" height="1" fill="#000000"/>
  <rect x="14" y="2" width="4" height="1" fill="#c00000"/>
