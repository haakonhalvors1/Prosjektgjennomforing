<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Win95-style "My Computer" icon: monitor on a desktop case -->
  <!-- Monitor -->
  <rect x="5" y="2" width="22" height="18" fill="#000000"/>
  <rect x="6" y="3" width="20" height="16" fill="#c0c0c0"/>
  <rect x="6" y="3" width="20" height="1" fill="#ffffff"/>
  <rect x="6" y="3" width="1" height="16" fill="#ffffff"/>
  <rect x="25" y="3" width="1" height="16" fill="#808080"/>
  <rect x="6" y="18" width="20" height="1" fill="#808080"/>
  <!-- Screen -->
  <rect x="8" y="5" width="16" height="11" fill="#000000"/>
  <rect x="9" y="6" width="14" height="9" fill="#008080"/>
  <rect x="10" y="7" width="5" height="1" fill="#ffffff"/>
  <rect x="10" y="9" width="8" height="1" fill="#7fd0d0"/>
  <!-- Neck -->
  <rect x="13" y="20" width="6" height="2" fill="#808080"/>
  <!-- Case -->
  <rect x="3" y="22" width="26" height="8" fill="#000000"/>
  <rect x="4" y="23" width="24" height="6" fill="#c0c0c0"/>
  <rect x="4" y="23" width="24" height="1" fill="#ffffff"/>
  <rect x="4" y="23" width="1" height="6" fill="#ffffff"/>
  <rect x="6" y="25" width="8" height="1" fill="#000000"/>
  <rect x="23" y="25" width="3" height="2" fill="#00a000"/>
</svg>
