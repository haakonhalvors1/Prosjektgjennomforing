<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn | Prosjektgjennomføring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Prosjektgjennomføring Gruppe 5</h1>
        </div>
    </header>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-link">Hjem</a>
            <a href="om-oss.html" class="nav-link">Om oss</a>
            <a href="login.html" class="nav-link active">Logg inn</a>
            <a href="tidligere-prosjekt.html" class="nav-link">Tidligere Prosjekt</a>
        </div>
    </nav>

    <main>
        <section class="container">
            <h2>Logg inn</h2>
            <p>Dette er en enkel mock av en innloggingsside. Ingen back-end er tilkoblet.</p>
            <form class="login-form" action="#" method="post">
                <label for="email">E-post</label>
                <input id="email" name="email" type="email" placeholder="din@epost.no" required>

                <label for="password">Passord</label>
                <input id="password" name="password" type="password" placeholder="Passord" required>

                <button type="submit" class="btn">Logg inn</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
